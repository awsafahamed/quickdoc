services:
  - type: web
    name: quickdoc-api
    runtime: node
    buildCommand: npm ci && npm run db:generate && npm --workspace apps/api run build
    preDeployCommand: npm --workspace apps/api run prisma:migrate && node apps/api/scripts/bootstrap-admin.cjs
    startCommand: npm --workspace apps/api run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGINS
        sync: false
