services:
  - type: web
    name: quickdoc-api
    runtime: node
    buildCommand: npm ci && npm run db:generate && npm --workspace apps/api run build
    startCommand: npm --workspace apps/api run prisma:migrate && node apps/api/scripts/bootstrap-admin.cjs && npm --workspace apps/api run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGINS
        sync: false
      - key: CUSTOMER_WEB_ORIGIN
        value: https://customer-web-murex-seven.vercel.app
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        value: https://quickdoc-tfwuf.onrender.com/api/v1/auth/oauth/google/callback
